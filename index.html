<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OshiStock - 推しグッズ管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pink: {
              50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af',
              400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c'
            },
            blue: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1'
            }
          },
          borderRadius: { 'xl': '1rem', '2xl': '1.5rem' }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", Meiryo, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 定数・初期値
    const INITIAL_CATEGORIES = [
      { id: 'cat-1', name: '缶バッジ', emoji: '🎀', sort_order: 1 },
      { id: 'cat-2', name: 'アクスタ', emoji: '✨', sort_order: 2 },
      { id: 'cat-3', name: 'ぬいぐるみ', emoji: '🧸', sort_order: 3 },
      { id: 'cat-4', name: 'その他', emoji: '📦', sort_order: 4 }
    ];

    const ITEM_TYPES = [
      '缶バッジ', 'アクリルスタンド', 'ラバーストラップ', 'ぬいぐるみ', 'クリアファイル',
      'ポストカード', 'タペストリー', 'キーホルダー', 'フィギュア', 'アクセサリー',
      'CD・Blu-ray', 'Tシャツ', 'トレカ', 'シール', 'マグカップ', 'その他'
    ];

    const TRADE_STATUSES = [
      { id: '募集中', label: '募集中', isReserve: true },
      { id: '連絡待ち', label: '連絡待ち', isReserve: true },
      { id: '条件確認中', label: '条件確認中', isReserve: true },
      { id: '発送待ち', label: '発送待ち', isReserve: true },
      { id: '発送済み', label: '発送済み', isReserve: true },
      { id: '受け取り待ち', label: '受け取り待ち', isReserve: true },
      { id: '完了', label: '完了', isReserve: false, isDone: true },
      { id: 'キャンセル', label: 'キャンセル', isReserve: false, isCancel: true }
    ];

    function App() {
      // ローカルストレージ復元
      const [theme, setTheme] = useState(() => localStorage.getItem('oshistock_theme') || 'pink');
      const [tab, setTab] = useState('home'); // home, items, trades, stats, settings
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('oshistock_items');
        return saved ? JSON.parse(saved) : [];
      });
      const [trades, setTrades] = useState(() => {
        const saved = localStorage.getItem('oshistock_trades');
        return saved ? JSON.parse(saved) : [];
      });
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('oshistock_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('oshistock_profile');
        return saved ? JSON.parse(saved) : { display_name: '管理者', bio: '', trade_terms: '', avatar_url: '' };
      });

      // 編集モーダル・画面系
      const [editingItem, setEditingItem] = useState(null);
      const [viewingItem, setViewingItem] = useState(null);
      const [editingTrade, setEditingTrade] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedWork, setSelectedWork] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('');

      // 保存の永続化
      useEffect(() => {
        localStorage.setItem('oshistock_theme', theme);
        localStorage.setItem('oshistock_items', JSON.stringify(items));
        localStorage.setItem('oshistock_trades', JSON.stringify(trades));
        localStorage.setItem('oshistock_categories', JSON.stringify(categories));
        localStorage.setItem('oshistock_profile', JSON.stringify(profile));
      }, [theme, items, trades, categories, profile]);

      // テーマカラー適用
      const primaryBg = theme === 'pink' ? 'bg-pink-500' : 'bg-blue-500';
      const primaryText = theme === 'pink' ? 'text-pink-600' : 'text-blue-600';
      const primaryBorder = theme === 'pink' ? 'border-pink-500' : 'border-blue-500';
      const lightBg = theme === 'pink' ? 'bg-pink-50' : 'bg-blue-50';

      // -------------------------------------------------------------
      // バックアップ（JSON書き出し / 復元）
      // -------------------------------------------------------------
      const handleExport = () => {
        const data = {
          version: '1.0',
          exported_at: new Date().toISOString(),
          items,
          trades,
          categories,
          profile
        };
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const filename = `oshistock_backup_${dateStr}_${items.length}items.json`;
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e, mode) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (!imported.items && !imported.trades) {
              alert('有効なOshiStockバックアップデータではありません。');
              return;
            }

            if (mode === 'replace') {
              if (confirm('現在のデータをすべて上書き削除して復元しますか？')) {
                setItems(imported.items || []);
                setTrades(imported.trades || []);
                if (imported.categories) setCategories(imported.categories);
                if (imported.profile) setProfile(imported.profile);
                alert('データを置き換えて復元しました！');
              }
            } else {
              // 追加（マージ）
              if (confirm('既存のデータに残りのデータを取り込みますか？（ID重複は自動回避）')) {
                const existingIds = new Set(items.map(i => i.id));
                const newItems = [...items];
                (imported.items || []).forEach(item => {
                  if (!existingIds.has(item.id)) {
                    newItems.push(item);
                  } else {
                    newItems.push({ ...item, id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5) });
                  }
                });
                setItems(newItems);
                setTrades(prev => [...prev, ...(imported.trades || [])]);
                alert('追加データを取り込みました！');
              }
            }
          } catch (err) {
            alert('JSONファイルの読み込みに失敗しました。');
          }
        };
        reader.readAsText(file);
      };

      // -------------------------------------------------------------
      // グッズ保存処理
      // -------------------------------------------------------------
      const handleSaveItem = (itemData) => {
        if (itemData.id) {
          setItems(items.map(i => i.id === itemData.id ? itemData : i));
        } else {
          const newItem = {
            ...itemData,
            id: 'item_' + Date.now(),
            created_at: new Date().toISOString()
          };
          setItems([newItem, ...items]);
        }
        setEditingItem(null);
      };

      const handleDeleteItem = (id) => {
        if (confirm('このグッズを削除してもよろしいですか？')) {
          setItems(items.filter(i => i.id !== id));
          setViewingItem(null);
        }
      };

      // 作品リスト抽出
      const worksList = useMemo(() => {
        const set = new Set(items.map(i => i.work_title).filter(Boolean));
        return Array.from(set);
      }, [items]);

      // グッズフィルタ
      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchQuery = !searchQuery || 
            (item.item_name || '').includes(searchQuery) ||
            (item.character_name || '').includes(searchQuery) ||
            (item.work_title || '').includes(searchQuery);
          const matchWork = !selectedWork || item.work_title === selectedWork;
          const matchCat = !selectedCategory || item.category === selectedCategory;
          return matchQuery && matchWork && matchCat;
        });
      }, [items, searchQuery, selectedWork, selectedCategory]);

      // 集計
      const stats = useMemo(() => {
        let totalCount = items.length;
        let totalQty = 0;
        let totalPrice = 0;
        let priceCount = 0;

        items.forEach(item => {
          const owned = Number(item.qty_owned || 0);
          const trade = Number(item.qty_trade || 0);
          const give = Number(item.qty_give || 0);
          totalQty += (owned + trade + give);

          if (item.has_price && item.purchase_price) {
            totalPrice += Number(item.purchase_price) * Number(item.purchase_quantity || 1);
            priceCount++;
          }
        });

        return { totalCount, totalQty, totalPrice, priceCount, unpricedCount: totalCount - priceCount };
      }, [items]);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 relative pb-20">
          {/* ヘッダー */}
          <header className={`p-4 ${primaryBg} text-white shadow-md flex justify-between items-center sticky top-0 z-10`}>
            <h1 className="text-xl font-bold tracking-wide">OshiStock</h1>
            <span className="text-xs px-2.5 py-1 bg-white/20 rounded-full font-medium">
              {items.length} 点のグッズ
            </span>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 p-4 space-y-4">

            {/* ホーム タブ */}
            {tab === 'home' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                  <h2 className="font-bold text-slate-700 text-lg">こんにちは！</h2>
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className={`${lightBg} p-3 rounded-xl`}>
                      <div className="text-xs text-slate-500 font-medium">グッズ点数</div>
                      <div className={`text-xl font-bold ${primaryText}`}>{stats.totalCount}</div>
                    </div>
                    <div className={`${lightBg} p-3 rounded-xl`}>
                      <div className="text-xs text-slate-500 font-medium">合計点数</div>
                      <div className={`text-xl font-bold ${primaryText}`}>{stats.totalQty}</div>
                    </div>
                    <div className={`${lightBg} p-3 rounded-xl`}>
                      <div className="text-xs text-slate-500 font-medium">取引中</div>
                      <div className={`text-xl font-bold ${primaryText}`}>{trades.filter(t => t.status !== '完了' && t.status !== 'キャンセル').length}</div>
                    </div>
                  </div>
                </div>

                {/* 検索バー */}
                <div className="relative">
                  <input
                    type="text"
                    placeholder="グッズ名・キャラ・作品で探す..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full bg-white pl-4 pr-10 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
                  />
                </div>

                {/* 最近追加したグッズ */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-slate-700">登録済みグッズ</h3>
                    <button onClick={() => setTab('items')} className={`text-xs ${primaryText} font-medium`}>すべて見る ➔</button>
                  </div>
                  {items.length === 0 ? (
                    <div className="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-100">
                      グッズがまだ登録されていません。「＋」から登録してみましょう！
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      {items.slice(0, 4).map(item => (
                        <div key={item.id} onClick={() => setViewingItem(item)} className="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm cursor-pointer hover:border-slate-300">
                          <div className="aspect-square bg-slate-100 rounded-xl mb-2 overflow-hidden flex items-center justify-center">
                            {item.image_url ? (
                              <img src={item.image_url} alt="" className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-2xl">🎁</span>
                            )}
                          </div>
                          <div className="text-xs text-slate-400 truncate">{item.work_title || '作品名なし'}</div>
                          <div className="font-bold text-sm text-slate-800 truncate">{item.item_name}</div>
                          <div className="text-xs font-semibold text-slate-600 mt-1">所持: {item.qty_owned || 0} 個</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* グッズ一覧 タブ */}
            {tab === 'items' && (
              <div className="space-y-3">
                <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                  <button
                    onClick={() => setSelectedWork('')}
                    className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${!selectedWork ? `${primaryBg} text-white` : 'bg-white border border-slate-200 text-slate-600'}`}
                  >
                    すべての作品
                  </button>
                  {worksList.map(work => (
                    <button
                      key={work}
                      onClick={() => setSelectedWork(work)}
                      className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${selectedWork === work ? `${primaryBg} text-white` : 'bg-white border border-slate-200 text-slate-600'}`}
                    >
                      {work}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {filteredItems.map(item => (
                    <div key={item.id} onClick={() => setViewingItem(item)} className="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm cursor-pointer">
                      <div className="aspect-square bg-slate-100 rounded-xl mb-2 overflow-hidden flex items-center justify-center relative">
                        {item.image_url ? (
                          <img src={item.image_url} alt="" className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-3xl">🎀</span>
                        )}
                        {item.is_public && (
                          <span className="absolute top-1.5 right-1.5 bg-emerald-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">公開中</span>
                        )}
                      </div>
                      <div className="text-[10px] text-slate-400 truncate">{item.work_title}</div>
                      <div className="font-bold text-xs text-slate-800 truncate">{item.item_name}</div>
                      <div className="flex gap-1 text-[10px] mt-1">
                        <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">所持:{item.qty_owned || 0}</span>
                        {(item.qty_trade > 0 || item.qty_give > 0) && (
                          <span className="bg-amber-100 px-1.5 py-0.5 rounded text-amber-700">確保中</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 取引 タブ */}
            {tab === 'trades' && (
              <div className="space-y-3">
                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex justify-between items-center">
                  <h2 className="font-bold text-slate-700">交換・譲渡の取引一覧</h2>
                  <button onClick={() => setEditingTrade({ status: '募集中', lines: [] })} className={`px-3 py-1.5 ${primaryBg} text-white rounded-full text-xs font-bold`}>＋ 取引作成</button>
                </div>
                {trades.length === 0 ? (
                  <div className="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-100">
                    登録されている取引はありません。
                  </div>
                ) : (
                  <div className="space-y-2">
                    {trades.map(trade => (
                      <div key={trade.id} className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm space-y-2">
                        <div className="flex justify-between items-center">
                          <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${trade.trade_type === 'exchange' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`}>
                            {trade.trade_type === 'exchange' ? '交換' : '譲渡'}
                          </span>
                          <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">{trade.status}</span>
                        </div>
                        <div className="text-sm font-bold text-slate-800">相手: {trade.partner_name || '未設定'}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 集計 タブ */}
            {tab === 'stats' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-4">
                  <h2 className="font-bold text-slate-700 text-lg">購入金額・数量の集計</h2>
                  <div className="space-y-3">
                    <div className="flex justify-between items-center border-b pb-2">
                      <span className="text-sm text-slate-500">合計所持数</span>
                      <span className="text-lg font-bold text-slate-800">{stats.totalQty} 個</span>
                    </div>
                    <div className="flex justify-between items-center border-b pb-2">
                      <span className="text-sm text-slate-500">概算購入合計</span>
                      <span className={`text-xl font-bold ${primaryText}`}>¥{stats.totalPrice.toLocaleString()}</span>
                    </div>
                    {stats.unpricedCount > 0 && (
                      <div className="text-xs text-amber-600 bg-amber-50 p-2.5 rounded-xl border border-amber-200">
                        ※ 価格未入力のグッズが {stats.unpricedCount} 件あります（集計から除外）。
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 設定 & バックアップ タブ */}
            {tab === 'settings' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm space-y-4">
                  <h2 className="font-bold text-slate-700">アプリ設定 & テーマ</h2>
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-slate-600">テーマカラー</span>
                    <div className="flex gap-2">
                      <button
                        onClick={() => setTheme('pink')}
                        className={`px-3 py-1 rounded-full text-xs font-bold ${theme === 'pink' ? 'bg-pink-500 text-white' : 'bg-slate-100 text-slate-600'}`}
                      >
                        ピンク
                      </button>
                      <button
                        onClick={() => setTheme('blue')}
                        className={`px-3 py-1 rounded-full text-xs font-bold ${theme === 'blue' ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-600'}`}
                      >
                        ブルー
                      </button>
                    </div>
                  </div>
                </div>

                {/* バックアップ領域 */}
                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm space-y-4">
                  <h2 className="font-bold text-slate-700">データとバックアップ</h2>

                  <div className="space-y-2">
                    <button
                      onClick={handleExport}
                      className="w-full py-3 bg-slate-800 text-white text-xs font-bold rounded-xl shadow-sm hover:bg-slate-900"
                    >
                      バックアップをダウンロード（JSON）
                    </button>
                  </div>

                  <div className="border-t pt-3 space-y-2">
                    <div className="text-xs font-bold text-slate-600">バックアップデータから復元</div>
                    
                    <label className="block w-full py-2.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl text-center border border-slate-200 cursor-pointer">
                      追加で取り込む（既存データは残す）
                      <input type="file" accept=".json" onChange={e => handleImport(e, 'add')} className="hidden" />
                    </label>

                    <label className="block w-full py-2.5 bg-rose-50 text-rose-600 text-xs font-bold rounded-xl text-center border border-rose-200 cursor-pointer">
                      置き換える（現在のデータを全削除して入れ替え）
                      <input type="file" accept=".json" onChange={e => handleImport(e, 'replace')} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 新規追加ボタン */}
          <button
            onClick={() => setEditingItem({ item_name: '', work_title: '', character_name: '', qty_owned: 1, purchase_quantity: 1, is_public: false })}
            className={`fixed right-5 bottom-20 w-14 h-14 ${primaryBg} text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold z-20`}
          >
            ＋
          </button>

          {/* ナビゲーションバー */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 px-1 z-10 pb-safe">
            {[
              { id: 'home', label: 'ホーム', icon: '🏠' },
              { id: 'items', label: 'グッズ', icon: '🎁' },
              { id: 'trades', label: '取引', icon: '🤝' },
              { id: 'stats', label: '集計', icon: '📊' },
              { id: 'settings', label: '設定', icon: '⚙️' }
            ].map(nav => (
              <button
                key={nav.id}
                onClick={() => setTab(nav.id)}
                className={`flex flex-col items-center py-1 px-3 rounded-xl ${tab === nav.id ? primaryText : 'text-slate-400'}`}
              >
                <span className="text-lg">{nav.icon}</span>
                <span className="text-[10px] font-medium mt-0.5">{nav.label}</span>
              </button>
            ))}
          </nav>

          {/* モーダル：グッズ詳細 */}
          {viewingItem && (
            <div className="fixed inset-0 bg-black/50 z-30 flex items-end justify-center">
              <div className="bg-white w-full max-w-md rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs text-slate-400">{viewingItem.work_title || '作品名なし'}</span>
                    <h3 className="text-lg font-bold text-slate-800">{viewingItem.item_name}</h3>
                  </div>
                  <button onClick={() => setViewingItem(null)} className="text-slate-400 text-xl font-bold">×</button>
                </div>

                <div className="aspect-square bg-slate-100 rounded-2xl overflow-hidden flex items-center justify-center">
                  {viewingItem.image_url ? (
                    <img src={viewingItem.image_url} alt="" className="w-full h-full object-cover" />
                  ) : (
                    <span className="text-5xl">🎁</span>
                  )}
                </div>

                <div className="grid grid-cols-3 gap-2 text-center bg-slate-50 p-3 rounded-2xl">
                  <div>
                    <div className="text-[10px] text-slate-400">所持中</div>
                    <div className="text-base font-bold text-slate-700">{viewingItem.qty_owned || 0}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">交換確保</div>
                    <div className="text-base font-bold text-indigo-600">{viewingItem.qty_trade || 0}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">譲渡確保</div>
                    <div className="text-base font-bold text-emerald-600">{viewingItem.qty_give || 0}</div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => { setEditingItem(viewingItem); setViewingItem(null); }} className="flex-1 py-3 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">編集</button>
                  <button onClick={() => handleDeleteItem(viewingItem.id)} className="py-3 px-4 bg-rose-50 text-rose-600 text-xs font-bold rounded-xl">削除</button>
                </div>
              </div>
            </div>
          )}

          {/* モーダル：グッズ登録/編集 */}
          {editingItem && (
            <ItemEditModal
              item={editingItem}
              categories={categories}
              onClose={() => setEditingItem(null)}
              onSave={handleSaveItem}
              primaryBg={primaryBg}
            />
          )}
        </div>
      );
    }

    // グッズ登録/編集フォーム
    function ItemEditModal({ item, categories, onClose, onSave, primaryBg }) {
      const [formData, setFormData] = useState({ ...item });

      const handleChange = (field, value) => {
        setFormData(prev => {
          const next = { ...prev, [field]: value };
          // 購入数と所持数の双方向連動
          if (field === 'purchase_quantity') {
            next.qty_owned = value;
          }
          return next;
        });
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setFormData(prev => ({ ...prev, image_url: event.target.result }));
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-40 flex items-end justify-center">
          <div className="bg-white w-full max-w-md rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-bold text-slate-800">{formData.id ? 'グッズ情報の編集' : '新しいグッズの登録'}</h3>
              <button onClick={onClose} className="text-slate-400 text-xl font-bold">×</button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="text-xs font-bold text-slate-600">グッズ画像</label>
                <input type="file" accept="image/*" onChange={handleImageUpload} className="mt-1 text-xs text-slate-500" />
                {formData.image_url && (
                  <div className="mt-2 w-20 h-20 bg-slate-100 rounded-xl overflow-hidden border">
                    <img src={formData.image_url} alt="" className="w-full h-full object-cover" />
                  </div>
                )}
              </div>

              <div>
                <label className="text-xs font-bold text-slate-600">グッズ名 <span className="text-rose-500">*</span></label>
                <input
                  type="text"
                  required
                  value={formData.item_name || ''}
                  onChange={e => handleChange('item_name', e.target.value)}
                  className="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-sm"
                  placeholder="例：トレーディング缶バッジ"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs font-bold text-slate-600">作品名</label>
                  <input
                    type="text"
                    value={formData.work_title || ''}
                    onChange={e => handleChange('work_title', e.target.value)}
                    className="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">キャラクター名</label>
                  <input
                    type="text"
                    value={formData.character_name || ''}
                    onChange={e => handleChange('character_name', e.target.value)}
                    className="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-sm"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs font-bold text-slate-600">購入数 / 所持数</label>
                  <input
                    type="number"
                    min="0"
                    value={formData.qty_owned || 1}
                    onChange={e => handleChange('purchase_quantity', Number(e.target.value))}
                    className="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">購入単価（円）</label>
                  <input
                    type="number"
                    min="0"
                    value={formData.purchase_price || ''}
                    onChange={e => {
                      handleChange('purchase_price', e.target.value);
                      handleChange('has_price', !!e.target.value);
                    }}
                    className="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-sm"
                    placeholder="例：550"
                  />
                </div>
              </div>

              <div className="flex items-center gap-2 pt-2">
                <input
                  type="checkbox"
                  id="is_public"
                  checked={formData.is_public || false}
                  onChange={e => handleChange('is_public', e.target.checked)}
                  className="w-4 h-4 text-pink-500 rounded"
                />
                <label htmlFor="is_public" className="text-xs font-bold text-slate-700">公開プロフィールに表示（公開する）</label>
              </div>
            </div>

            <div className="pt-3 border-t flex gap-2">
              <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl">キャンセル</button>
              <button
                onClick={() => {
                  if (!formData.item_name) {
                    alert('グッズ名を入力してください');
                    return;
                  }
                  onSave(formData);
                }}
                className={`flex-1 py-3 ${primaryBg} text-white font-bold text-xs rounded-xl shadow-md`}
              >
                保存する
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
